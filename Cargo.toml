[workspace]
resolver = "2"
members = [
    "crates/injector",
    "crates/certgen",
    "crates/daemon",
    "crates/hal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "AGPL-3.0-or-later"
authors = ["FKTee-rs Contributors"]
repository = "https://github.com/SHuiTU68/FrameworkPatch"

[workspace.dependencies]
# 日志
log = "0.4"
env_logger = "0.11"
# 序列化
serde = { version = "1", features = ["derive"] }
toml = "0.8"
quick-xml = { version = "0.36", features = ["serialize"] }
# 加密（证书生成）
ring = "0.17"
rsa = "0.9"
rand = "0.8"
pkcs8 = { version = "0.10", features = ["pem"] }
x509-cert = { version = "0.2", features = ["builder"] }
der = "0.7"
# 系统调用（ptrace 注入）
nix = { version = "0.29", features = ["ptrace", "signal", "process", "fs", "user", "aio"] }
# PLT hook（binder ioctl）— LSPlt 是 C++ 库，通过 FFI 调用
# lsplt-rs 不在 crates.io，injector 中通过 extern "C" 直接链接 vendored LSPlt
# 参考 OhMyKeymint 的做法：vendor LSPlt 源码 + Rust FFI wrapper
# JNI（certgen 被 daemon 通过 JNI 调用，或直接用 Native API）
jni = "0.21"
# Android binder（HAL service 注册 / KeyMint 代理转发）
# 0.10 提供 sync-only 模式（default-features=false），匹配 AOSP binder 线程池模型。
rsbinder = { version = "0.10", default-features = false }
# 文件监听（热配置）
hotwatch = "0.5"
# 工具
anyhow = "1"
thiserror = "1"
once_cell = "1"
parking_lot = "0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = false

# inject_payload.so 必须保留 entry 符号供远程 dlsym 查找，
# 覆盖 workspace 的 strip=symbols，否则 dlsym 返回 NULL。
[profile.release.package.fktee-injector]
strip = false
