[package]
name = "fktee-hal"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "fktee-hal"
path = "src/main.rs"

[dependencies]
rsbinder = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
# 证书伪造（attestation 扩展 + X.509 证书链 + keybox 解析）。
certgen = { path = "../certgen" }
# 错误处理。
anyhow = { workspace = true }
# 全局状态（real HAL 代理句柄 / 配置）的并发容器。
once_cell = { workspace = true }
parking_lot = { workspace = true }
# 配置文件解析。
serde = { workspace = true }
toml = { workspace = true }

[build-dependencies]
rsbinder-aidl = "0.10"
