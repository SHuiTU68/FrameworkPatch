name: Build FKTee-rs

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'module/**'
      - 'webui/**'
      - '.github/workflows/build-fktee.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Set NDK env
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup_ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup_ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "${{ steps.setup_ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Run unit tests (host)
        run: cargo test --workspace --no-fail-fast

      - name: Build Rust binaries (arm64-v8a only)
        run: |
          # 仅构建 arm64-v8a（移除 x86_64 支持，减小体积与构建时间）
          cargo ndk -t arm64-v8a build --release -p fktee-injector
          cargo ndk -t arm64-v8a build --release -p fktee-daemon
          cargo ndk -t arm64-v8a build --release -p certgen
          cargo ndk -t arm64-v8a build --release -p fktee-hal

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build WebUI
        working-directory: webui
        run: |
          npm ci
          npm run build

      - name: Package Magisk module
        run: |
          mkdir -p output
          mkdir -p module/libs/arm64-v8a
          # arm64-v8a
          cp target/aarch64-linux-android/release/inject            module/libs/arm64-v8a/inject
          cp target/aarch64-linux-android/release/fktee             module/libs/arm64-v8a/fktee
          # payload 是 inject_payload cdylib（定义 entry()）
          cp target/aarch64-linux-android/release/libinject_payload.so module/libs/arm64-v8a/injector.payload
          # fktee-hal：KeyMint HAL 替换实现（方案 A）
          cp target/aarch64-linux-android/release/fktee-hal     module/libs/arm64-v8a/fktee-hal
          cd module && zip -r ../output/FKTee-rs-v0.1.0.zip . -x '*.git*'

      - uses: actions/upload-artifact@v4
        with:
          name: FKTee-rs
          path: output/

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: output/*.zip
