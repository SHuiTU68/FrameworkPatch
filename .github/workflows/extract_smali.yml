name: Extract smali adaptation info

# 触发条件：
#   1. push 到 main 且 device_input/ 或根目录 classes*.dex 有变动
#      （兼容用户在 GitHub 网页直接上传到根目录的情况，CI 会自动挪到 device_input/）
#   2. 手动触发（Actions 页面点 Run workflow）
on:
  push:
    branches: [main]
    paths:
      - 'device_input/**'
      - 'classes.dex'
      - 'classes*.dex'
      - 'framework.jar'
      - 'device_info.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-smali
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check input exists (framework.jar or classes*.dex)
        id: check
        run: |
          # 兼容用户上传到根目录的情况：把根目录的 classes*.dex / framework.jar / device_info.txt 挪进 device_input/
          mkdir -p device_input
          moved=0
          for f in classes.dex classes2.dex classes3.dex classes4.dex classes5.dex classes6.dex classes7.dex classes8.dex classes9.dex classes10.dex framework.jar device_info.txt; do
            if [ -f "$f" ] && [ ! -f "device_input/$f" ]; then
              mv "$f" "device_input/$f"
              echo "已移动 $f -> device_input/$f"
              moved=1
            fi
          done
          # 通配兜底：根目录任何 classes*.dex
          for f in classes*.dex; do
            [ -f "$f" ] || continue
            [ -f "device_input/$f" ] && continue
            mv "$f" "device_input/$f"
            echo "已移动 $f -> device_input/$f"
            moved=1
          done
          if [ "$moved" = "1" ]; then
            # 移动了文件，需要提交，否则下次 push paths 仍匹配根目录
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A device_input/
            git commit -m "chore: 整理 dex 输入到 device_input/" || true
            # 注意：不在这里 push，避免与后续 commit 冲突；后面 commit 报告时一起 push
          fi

          # 优先 framework.jar，否则 classes*.dex（绕开 GitHub 25MB 网页上传限制）
          if [ -f device_input/framework.jar ]; then
            SIZE=$(wc -c < device_input/framework.jar)
            echo "framework.jar 大小: $SIZE 字节"
            if [ "$SIZE" -gt 104857600 ]; then
              echo "::error::framework.jar 超过 100MB，请改上传 classes*.dex（手机用 scripts/extract_dex_on_device.sh 提取）"
              exit 1
            fi
            echo "input_mode=jar" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif ls device_input/classes*.dex >/dev/null 2>&1; then
            DEX_COUNT=$(ls -1 device_input/classes*.dex 2>/dev/null | wc -l)
            echo "检测到 $DEX_COUNT 个 dex 文件:"
            ls -la device_input/classes*.dex
            echo "input_mode=dex" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未找到 framework.jar 或 classes*.dex，跳过提取"
            echo "手机上执行: su -c 'sh scripts/extract_dex_on_device.sh' 提取 dex 后上传到 device_input/"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build baksmali fat jar
        if: steps.check.outputs.found == 'true'
        run: |
          # maven central 的 baksmali-X.jar 不含依赖（dexlib2 等），单独运行报 NoClassDefFoundError
          # google/smali releases 也没附 jar，所以 clone + ./gradlew :baksmali:fatJar 生成
          set -e
          if [ ! -f baksmali.jar ]; then
            echo "=== clone google/smali ==="
            git clone --depth=1 https://github.com/google/smali.git /tmp/smali
            cd /tmp/smali
            export GRADLE_USER_HOME=/tmp/smali-gradle
            # 该项目的 fat task 名是 :baksmali:fatJar（见 baksmali/build.gradle）
            echo "=== ./gradlew :baksmali:fatJar ==="
            ./gradlew :baksmali:fatJar --no-daemon --console=plain 2>&1 | tail -30
            echo "=== build/libs 产物 ==="
            ls -la /tmp/smali/baksmali/build/libs/ || true
            # fatJar 产出的 fat jar 名形如 baksmali-3.0.9-fat.jar，且会建 baksmali.jar 符号链接
            FAT=$(find /tmp/smali/baksmali/build/libs -maxdepth 1 -type f \( -name 'baksmali-*-fat.jar' -o -name 'baksmali-fat.jar' \) 2>/dev/null | head -1)
            if [ -z "$FAT" ]; then
              echo "::error::未找到 baksmali fat jar"
              exit 1
            fi
            echo "选用 fat jar: $FAT"
            cp -f "$FAT" "$GITHUB_WORKSPACE/baksmali.jar"
          fi
          echo "=== baksmali 版本 ==="
          java -jar "$GITHUB_WORKSPACE/baksmali.jar" --version 2>&1 | head -3 || true

      - name: Run extract script
        if: steps.check.outputs.found == 'true'
        run: |
          bash scripts/extract_smali.sh

      - name: Show report
        if: steps.check.outputs.found == 'true'
        run: |
          echo "=========== ADAPT_REPORT.md ==========="
          cat report/ADAPT_REPORT.md

      # ===== 构建 patched framework.jar =====
      # 需要 3 个 hook 类都找到才构建
      - name: Check hook points found
        id: hooks
        if: steps.check.outputs.found == 'true'
        run: |
          # 从报告里判断 3 个 hook 点是否都找到
          if grep -q "AndroidKeyStoreSpi.*✓" report/ADAPT_REPORT.md \
             && grep -q "Instrumentation.*✓" report/ADAPT_REPORT.md \
             && grep -q "SystemProperties.*✓" report/ADAPT_REPORT.md; then
            echo "hooks_found=true" >> "$GITHUB_OUTPUT"
            echo "3 个 hook 点全部找到，开始构建 patched framework.jar"
          else
            echo "hooks_found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::hook 点未全部找到，跳过构建 patched framework.jar"
          fi

      - name: Ensure keybox.xml exists
        id: kb
        if: steps.hooks.outputs.hooks_found == 'true'
        run: |
          # 直接用仓库根目录的 keybox.xml（已提交）
          # generateKeybox task 会自动读取，无需 secret
          if [ -f keybox.xml ]; then
            echo "source=repo" >> "$GITHUB_OUTPUT"
            echo "使用仓库根目录 keybox.xml ($(wc -c < keybox.xml) 字节)"
          else
            echo "source=test" >> "$GITHUB_OUTPUT"
            echo "::notice::仓库无 keybox.xml，使用 keybox.xml.example（测试密钥）"
          fi

      - name: Build FrameworkPatch APK
        if: steps.hooks.outputs.hooks_found == 'true'
        env:
          PROFILE: '0'
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace -PactiveProfile=$PROFILE

      - name: Detect API level from device_info
        id: api
        if: steps.hooks.outputs.hooks_found == 'true'
        run: |
          API=36
          if [ -f device_input/device_info.txt ]; then
            API=$(grep -oP 'ro\.build\.version\.sdk=\K[0-9]+' device_input/device_info.txt | head -1 || true)
            [ -z "$API" ] && API=36
          fi
          echo "API level: $API"
          echo "api_level=$API" >> "$GITHUB_OUTPUT"

      - name: Build patched framework.jar + Magisk module
        if: steps.hooks.outputs.hooks_found == 'true'
        env:
          API_LEVEL: ${{ steps.api.outputs.api_level }}
        run: |
          bash scripts/build_framework.sh

      - name: Upload patched framework.jar as artifact
        if: steps.hooks.outputs.hooks_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: patched-framework
          path: |
            release/framework.jar
            release/classes.dex.patched
            release/classes3.dex.patched
            release/frameworkpatch.dex
          retention-days: 30
          if-no-files-found: error

      - name: Upload Magisk module as artifact
        if: steps.hooks.outputs.hooks_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FrameworkPatch-Magisk-module
          path: release/FrameworkPatch-PLC110-Magisk.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload full smali as artifact
        if: steps.check.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smali-decompiled
          path: fw_work/smali_*/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload report as artifact
        if: steps.check.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: adapt-report
          path: report/ADAPT_REPORT.md
          retention-days: 30

      - name: Commit report + build artifacts to main
        if: steps.check.outputs.found == 'true'
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f report/ADAPT_REPORT.md
          # 如果构建了 patched framework.jar / Magisk 模块，也提交（release/ 被 .gitignore 忽略，需 -f）
          if [ "${{ steps.hooks.outputs.hooks_found }}" = "true" ] && [ -d release ]; then
            git add -f release/
          fi
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          INPUT_DIGEST="unknown"
          if [ -f device_input/framework.jar ]; then
            INPUT_DIGEST="jar:$(md5sum device_input/framework.jar | awk '{print $1}')"
          else
            INPUT_DIGEST="dex:$(cat device_input/classes*.dex | md5sum | awk '{print $1}')"
          fi
          ARTIFACTS_INFO="无构建产物"
          if [ -f release/FrameworkPatch-PLC110-Magisk.zip ]; then
            ARTIFACTS_INFO="含 patched framework.jar + Magisk 模块"
          fi
          git commit -m "build: smali 适配报告 + patched framework.jar @ $(date -u '+%Y-%m-%d %H:%M UTC')

          - 输入指纹: $INPUT_DIGEST
          - 产物: $ARTIFACTS_INFO
          - 由 extract_smali workflow 自动生成"
          git push origin HEAD:main
