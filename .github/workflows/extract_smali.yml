name: Extract smali adaptation info

# 触发条件：
#   1. push 到 main 且 device_input/ 下有变动（你上传 framework.jar 后自动跑）
#   2. 手动触发（Actions 页面点 Run workflow）
on:
  push:
    branches: [main]
    paths:
      - 'device_input/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-smali
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check input exists (framework.jar or classes*.dex)
        id: check
        run: |
          # 优先 framework.jar，否则 classes*.dex（绕开 GitHub 25MB 网页上传限制）
          if [ -f device_input/framework.jar ]; then
            SIZE=$(wc -c < device_input/framework.jar)
            echo "framework.jar 大小: $SIZE 字节"
            if [ "$SIZE" -gt 104857600 ]; then
              echo "::error::framework.jar 超过 100MB，请改上传 classes*.dex（手机用 scripts/extract_dex_on_device.sh 提取）"
              exit 1
            fi
            echo "input_mode=jar" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif ls device_input/classes*.dex >/dev/null 2>&1; then
            DEX_COUNT=$(ls -1 device_input/classes*.dex 2>/dev/null | wc -l)
            echo "检测到 $DEX_COUNT 个 dex 文件:"
            ls -la device_input/classes*.dex
            echo "input_mode=dex" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未找到 framework.jar 或 classes*.dex，跳过提取"
            echo "手机上执行: su -c 'sh scripts/extract_dex_on_device.sh' 提取 dex 后上传到 device_input/"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download baksmali
        if: steps.check.outputs.found == 'true'
        run: |
          # 从 maven central 下载 baksmali fat jar，依次尝试多个版本
          for v in 3.0.5 3.0.4 2.5.2 2.5.1; do
            url="https://repo1.maven.org/maven2/org/smali/baksmali/$v/baksmali-$v-fat.jar"
            echo "尝试下载 baksmali $v ..."
            if curl -fsSL -o baksmali.jar "$url"; then
              echo "::notice::已下载 baksmali $v"
              break
            fi
          done
          test -s baksmali.jar || { echo "::error::baksmali 下载失败"; exit 1; }
          java -jar baksmali.jar --version 2>&1 | head -1 || true

      - name: Run extract script
        if: steps.check.outputs.found == 'true'
        run: |
          bash scripts/extract_smali.sh

      - name: Show report
        if: steps.check.outputs.found == 'true'
        run: |
          echo "=========== ADAPT_REPORT.md ==========="
          cat report/ADAPT_REPORT.md

      - name: Upload full smali as artifact
        if: steps.check.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smali-decompiled
          path: fw_work/smali_*/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload report as artifact
        if: steps.check.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: adapt-report
          path: report/ADAPT_REPORT.md
          retention-days: 30

      - name: Commit report to main
        if: steps.check.outputs.found == 'true'
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f report/ADAPT_REPORT.md
          if git diff --cached --quiet; then
            echo "报告无变化，跳过提交"
            exit 0
          fi
          INPUT_DIGEST="unknown"
          if [ -f device_input/framework.jar ]; then
            INPUT_DIGEST="jar:$(md5sum device_input/framework.jar | awk '{print $1}')"
          else
            INPUT_DIGEST="dex:$(cat device_input/classes*.dex | md5sum | awk '{print $1}')"
          fi
          git commit -m "chore: 更新 smali 适配报告 @ $(date -u '+%Y-%m-%d %H:%M UTC')

          - 输入指纹: $INPUT_DIGEST
          - 由 extract_smali workflow 自动生成"
          git push origin HEAD:main
