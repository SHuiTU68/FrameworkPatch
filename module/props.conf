# FKTee-rs prop 属性隐藏配置（service.sh 读取并应用）
#
# 格式：
#   key=value          无条件覆盖（先 resetprop --delete 再 set），每轮轮询执行
#   key~match=value    仅当 getprop(key) 包含 match 时才覆盖（每轮轮询执行）
#   once:key=value     仅开机时执行一次，主循环轮询跳过
#   once:key~match=... 一次性 + 条件覆盖可组合
# # 开头与空行忽略；特殊键 enabled=1/0 控制总开关（缺省视为 1）。
#
# 这些属性是 Play Integrity / 反作弊常查的 verified boot / debug / build 状态。
enabled=1

# ---------- 启动完成标志（仅开机执行一次） ----------
# once: 前缀使其只在开机时执行一次，避免 service.sh 每 5s 轮询持续把它
# 压回 0 导致系统误判“未完成开机”。
once:sys.boot_completed=0

# ---------- Verified Boot / 锁定状态 ----------
ro.boot.vbmeta.device_state=locked
ro.boot.verifiedbootstate=green
ro.boot.flash.locked=1
ro.boot.veritymode=enforcing
ro.boot.warranty_bit=0
ro.warranty_bit=0
ro.vendor.boot.warranty_bit=0
ro.vendor.warranty_bit=0
vendor.boot.vbmeta.device_state=locked
vendor.boot.verifiedbootstate=green
sys.oem_unlock_allowed=0

# MIUI specific
ro.secureboot.lockstate=locked

# ---------- 调试 / 安全标志 ----------
ro.debuggable=0
ro.force.debuggable=0
ro.secure=1
ro.adb.secure=1

# ---------- Build 标识 ----------
ro.build.type=user
ro.build.tags=release-keys

# ---------- 隐藏 recovery 启动模式 ----------
# 仅当 bootmode 含 "recovery" 时改为 unknown（避免误改 normal 模式）。
ro.bootmode~recovery=unknown
ro.boot.bootmode~recovery=unknown
vendor.boot.bootmode~recovery=unknown
