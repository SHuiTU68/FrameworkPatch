# FKTee-rs prop 属性隐藏配置（service.sh 读取并应用）
#
# 格式：每行 key=value，# 开头与空行忽略。
# 特殊键 enabled=1 / enabled=0 控制总开关（缺省视为 1）。
# 其余行通过 resetprop 覆盖（先 --delete 再 set，保证读取看不到原值）。
#
# 这些属性是 Play Integrity / 反作弊常查的 verified boot 状态。
enabled=1
ro.boot.verifiedbootstate=green
ro.boot.flash.locked=1
ro.boot.vbmeta.device_state=locked
ro.boot.veritymode=enforcing
