# FKTee-rs hal.toml — KeyMint HAL 替换路径（方案 A）配置
#
# 此文件仅在 HAL 模式启用时被 fktee-hal 读取。
# 启用 HAL 模式：touch /data/adb/Tee-rs/hal.enabled
#   - post-fs-data.sh 检测到 hal.enabled 后，sed 重写 vintf manifest
#     把真 HAL 实例名 default → fktee-real
#   - service.sh 检测到 hal.enabled 后，启动 fktee-hal（替代 inject 路径）
#   - 删除 hal.enabled 即恢复 inject 路径（需重启）
#
# 风险提示：HAL 模式下若 fktee-hal 启动失败且 vintf 已重写，keystore2 将
# 无 HAL 可用，设备 keystore 短时不可用。调试期建议保留 inject 路径作为
# fallback，确认 HAL 稳定后再启用。

# 真 HAL 被 vintf manifest 重命名后的实例名（不含接口前缀）。
# fktee-hal 抢注 default，按此名 wait_for_interface 拿真 HAL 代理转发。
# 必须与 post-fs-data.sh 里的 sed 替换目标一致。
real_hal_instance = "fktee-real"

# keybox.xml 路径（与 inject 路径共用）。
keybox_path = "/data/adb/Tee-rs/keybox.xml"

# 白名单文件路径（每行一个包名，# 与空行跳过）。
allow_list_path = "/data/adb/Tee-rs/allow.list"

[hook]
# 总开关。
# true  = 对 allow.list 中列出的应用进行 attestation 伪造
# false = 纯代理，所有事务透传真 HAL（用于调试 / 紧急关闭）
enabled = true

# 伪造模式（参考 TEESimulator 的 ! / ? 概念）：
#   auto       = 自动选择（当前等价 generation）
#   generation = 软件生成完整虚拟密钥，keyBlob 与 leaf 证书公钥一致，
#                 begin/finish 用软件密钥签名。彻底，通过公钥一致性检测。
#                 （对应 TEESimulator ! Force Generation Mode）
#   leaf_hack  = 透传真 HAL keyBlob，仅替换证书链。leaf 公钥 ≠ keyBlob 公钥，
#                 高级检测会失败。兼容性最好。
#                 （对应 TEESimulator ? Force Leaf Hacking）
forge_mode = "auto"

# 白名单包名（可选）。allow.list 文件存在时覆盖此声明。
# allow_packages = ["com.example.app"]

[device]
# DeviceInfo 字段。**auto 语义**：值为 0 或 -1 = 自动从系统 prop 读取真实值；
# 值 >0 = 用户自定义（原样写入 attestation 扩展）。
# 不填=等价 0=auto。建议保持 auto 让 attestation 与真机系统版本一致，避免可疑。
android_version = 0       # auto ← ro.build.version.release（主版本号）
os_version = 0            # auto ← ro.build.version.os_version / SDK 推算
os_patch_level = 0        # auto ← ro.build.version.security_patch (YYYYMMDD)
vendor_patch_level = 0    # auto ← ro.vendor.build.security_patch
boot_patch_level = 0      # auto ← 回退到 security_patch（无独立 boot patch 属性）
keymaster_version = 0     # auto ← certgen 兜底为 300（KeyMint1）。填 400=KeyMint2
attestation_version = 0   # auto ← certgen 兜底为 300。填 400=KeyMint2 attestation
security_level = 1        # 0=auto(certgen 兜底 TEE=1) 1=TEE 2=StrongBox。建议固定 1