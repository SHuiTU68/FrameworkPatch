# FKTee-rs injector.toml — 白名单配置
#
# 白名单模式：注入 keystore2 后，仅对 allow_packages（或独立的 allow.list 文件）
# 中列出的应用进行 attestation 伪造。未列出的应用保持真实硬件证书。
#
# 白名单列表：在 allow_packages（或 allow.list 文件，优先级更高）中指定包名。
# 空列表 = 不伪造任何应用。

[hook]
# 总开关。
# true  = 对 allow.list 中列出的应用进行 attestation 伪造
# false = hook 不生效，所有事务透传
enabled = true

# 白名单包名（可选）。建议用 WebUI「白名单」标签编辑 allow.list 文件，
# 那样更直观；此处的声明会被 allow.list 文件覆盖。
# allow_packages = ["com.example.app"]

[intercept]
# 各事务拦截开关（默认全开）。关闭某项 = 该类事务透传不伪造。
get_key_entry = true
generate_key = true
import_key = true
create_operation = true
delete_key = true
list_entries = true
grant = true