# FKTee-rs injector.toml — 全局 hook + 黑名单配置
#
# 全局模型：注入 keystore2 后，所有应用的 attestation 请求一律用本模块
# keybox 签发伪造证书链。不再有“勾选应用 / scoop 白名单”——所有走
# keystore2 的应用都受影响。
#
# 黑名单：列在 deny_packages（或独立的 deny.list 文件，优先级更高）中的
# 应用包名会被豁免，保留其真实硬件证书。用于个别敏感 App 不想被伪造。

[hook]
# 全局总开关。
# true  = 所有应用的 keystore2 attestation 都用 keybox 伪造
# false = hook 不生效，所有事务透传
enabled = true

# 黑名单包名（可选）。建议用 WebUI「黑名单」标签编辑 deny.list 文件，
# 那样更直观；此处的声明会被 deny.list 文件覆盖。
# deny_packages = ["com.example.app"]

[intercept]
# 各事务拦截开关（默认全开）。关闭某项 = 该类事务透传不伪造。
get_key_entry = true
generate_key = true
import_key = true
create_operation = true
delete_key = true
list_entries = true
grant = true
